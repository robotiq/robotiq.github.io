name: CI

# Checks that the site still builds before a change is merged. The build
# also fetches robotiq/.github's profile/README.md (see
# scripts/fetch-profile-readme.js), so it fails if that can't be fetched.
# Keep the job id `build-and-test`: the main branch ruleset requires a
# check with that exact name.

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm

      # Fails on a Node.js whose bundled Brotli is vulnerable to
      # CVE-2026-111497 (see FIXED in scripts/check-node-version.js).
      - name: Check Node.js version
        run: node scripts/check-node-version.js

      - name: Install dependencies
        run: npm ci

      # Fails if any production dependency, direct or transitive, isn't
      # under an allowlisted permissive license (fails closed, so copyleft
      # and unknown licenses both fail) — copyleft would conflict with this
      # site's BSD-3-Clause license, and src/pages/license.md states none
      # is used. Reads package-lock.json. Not `license-checker --failOn`:
      # it compares whole license strings, so "GPL" never matches a real
      # SPDX id like GPL-3.0-only.
      - name: Check dependency licenses
        run: node scripts/check-dependency-licenses.js

      # GITHUB_TOKEN only lifts the GitHub API rate limit for the README
      # fetch; it grants nothing extra.
      - name: Build
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
