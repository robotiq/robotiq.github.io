name: CI

# Verifies the documentation site builds and passes basic smoke tests.
# Intended to be a required status check for merging into main.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      # Submodules aren't checked out here — scripts/sync-external-docs.js
      # runs `git submodule update --init --force` itself as part of the
      # build (needed for local `npm start`/`npm run build` too), so doing
      # it again via actions/checkout would just be a redundant second fetch.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # scripts/sync-external-docs.js shells out to the `doxygen` binary
      # (see its doxygen2docusaurus job handling) to build the C++ library's
      # API reference — not an npm package, so `npm ci` above can't provide
      # it. ubuntu-latest doesn't have it preinstalled. graphviz (`dot`) is
      # also required even though this repo's own Doxyfiles never set
      # HAVE_DOT=YES: the apt-installed Doxygen version's own default is
      # YES (newer Doxygen releases default it to NO, which is why this
      # was never hit testing locally against a newer local install) — so
      # it tries to render inheritance/collaboration graphs regardless.
      # Without `dot`, that fails outright ("problems opening map file ...
      # for inclusion in the docs"), and WARN_AS_ERROR=FAIL_ON_WARNINGS
      # (see the submodule's own Doxyfile) turns that into a hard failure
      # here. Confirmed by reproducing this exact failure in a clean
      # Ubuntu container with the apt-installed Doxygen version, then
      # confirming `apt install graphviz` alone fixes it.
      - name: Install Doxygen and Graphviz
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz

      # Fails on broken internal links / anchors (onBrokenLinks: 'throw')
      # and runs the sync + tools-table generators via the prebuild hook.
      - name: Build
        run: npm run build

      # generate-tools-table.js (run above, via the prebuild hook) rewrites
      # docs/intro.mdx, every product's own index.mdx/ROS/index.mdx, and any
      # tool/guide page that's grown a self-installed sub-section list — all
      # committed files, none of them gitignored (only the submodule-synced
      # docs/drivers/**/*.md content is — see the comment above that rule in
      # .gitignore). It does the exact same thing under versioned-tools/ for
      # a per-tool-versioned tool's own wrapper page (see
      # docs/contribute/versioning.mdx) — same gitignore split there
      # (versioned-tools/**/*.md), so this check covers both directories.
      # Nothing else regenerates and commits these after a merge, so a PR
      # that changes something the generator depends on (e.g. a Dependabot
      # submodule bump) without also re-running it locally would otherwise
      # silently ship a deployed site that doesn't match what's committed.
      # This catches that here, generically — no file list to keep in sync
      # as the generator's own output grows.
      - name: Verify generated content is committed
        run: git diff --exit-code -- docs/ versioned-tools/

      # Smoke-tests the generated output (key pages + tools table present).
      - name: Test
        run: npm test

      # Catches forgetting to point external/<submodule> back at its real
      # branch after prototyping against a WIP one (see "Previewing local
      # edits to a submodule" in docs/contribute/index.mdx) — the pin must
      # be reachable from the submodule repo's own actual default branch
      # (checked directly against the remote, not external-jobs.js's
      # `branch` field — see check-submodule-pins.js's own header comment
      # for why that field can't be trusted as ground truth here). Runs
      # after Build/Test (not before) so it reuses the submodule checkout
      # sync-external-docs.js's own build step already did, rather than
      # fetching it again here.
      - name: Verify submodule pins are on their repo's default branch
        run: node scripts/check-submodule-pins.js
