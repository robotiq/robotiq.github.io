name: Deploy to GitHub Pages

# Runs on every push to main, and daily via rebuild-daily.yml. Visitors see
# README changes without a rebuild (the Software Tools page fetches the latest
# robotiq/.github profile/README.md in their browser, see
# src/pages/software-tools.js); the daily rebuild keeps the build-time copy
# used as a fallback no more than a day old. No `schedule:` here: see
# rebuild-daily.yml for why.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm

      # Fails on a Node.js whose bundled Brotli is vulnerable to
      # CVE-2026-111497 (see FIXED in scripts/check-node-version.js).
      - name: Check Node.js version
        run: node scripts/check-node-version.js

      - name: Install dependencies
        run: npm ci

      # GITHUB_TOKEN only lifts the GitHub API rate limit for the README
      # fetch in scripts/fetch-profile-readme.js (shared runner IPs can hit
      # the unauthenticated 60 requests/hour); it grants nothing extra.
      - name: Build
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
